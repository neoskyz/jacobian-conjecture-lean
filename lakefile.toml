# Independent Lean formalization: the JSP-000037 / MathDB #315779 target is false.
# Lean v4.33.1 and Mathlib 0df444a360eaa60ab8c11dca51a86af692955474 (MathDB's frozen environment
# for this target), via mathdb-lean/problems at aa532247 (provides MathDBUtil, used by the target).
# The frozen target module FtpEvalBench.Sun_Jacobian is supplied by MathDB; it is not in this repo.
# Root `Submission.lean` is the MathDB entry point; check it locally with scripts/check_submission.sh.
name = "jacobian_disproof"
defaultTargets = ["JacobianDisproof"]

[leanOptions]
pp.unicode.fun = true
autoImplicit = false
relaxedAutoImplicit = false

[[require]]
name = "mathdb_lean"
git = "https://github.com/mathdb-lean/problems"
rev = "aa532247d0301aca9a1c62f119920622f465878b"

[[lean_lib]]
name = "JacobianDisproof"
